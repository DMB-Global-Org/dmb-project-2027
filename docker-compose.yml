# Local Postgres for backend integration tests (never touches Supabase).
#   docker compose up -d --wait
#   pnpm --filter backend test:int
services:
  postgres-test:
    image: postgres:17-alpine
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dmb_test
    # Many org_* schemas in one restore transaction need more than the default 64 locks.
    command: ['postgres', '-c', 'max_locks_per_transaction=512']
    # Throwaway data: tests recreate every schema on each run.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dmb_test']
      interval: 2s
      timeout: 3s
      retries: 15
